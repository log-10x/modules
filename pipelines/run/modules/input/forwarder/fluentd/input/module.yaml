#
# 🔟❎ 'run' Fluentd Forward input module

module:

  name: fluentdInput

  title: Fluentd Forward input

  description: read events from Fluentd over the Fluent Forward protocol (TCP or Unix socket)

  doc: '+include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/fluentd/input/doc.md":""'

  allowMultiple: false

  options:

    - names:
        - fluentdInputPort
      description: TCP port to listen on for events from Fluentd's out_forward plugin
      type: String
      required: false
      defValue: 24224
      doc: |
        TCP port where Log10x listens for events sent by Fluentd's `out_forward`
        plugin. Match this against the `port` in your Fluentd `<server>` block.

    - names:
        - fluentdInputPath
      description: Unix domain socket path to listen on (Linux/macOS)
      type: String
      required: false
      defValue:
      doc: |
        When set, Log10x listens on a Unix domain socket instead of TCP — useful
        on Linux/macOS to avoid TCP overhead. Configure Fluentd's `out_forward`
        with `<transport unix>` + a matching `path`. Ignored on Windows.

    - names:
        - fluentdMessageField
      description: name of the JSON field carrying the original log line
      type: String
      required: false
      defValue: log
      doc: |
        Name of the field in each Fluentd record that contains the actual log
        message text. The default (`log`) matches Fluentd's `in_tail` plugin
        convention for container and file logs. Set to e.g. `message` if your
        sources emit the log line under a different key.
