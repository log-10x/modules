#
# 🔟❎ 'run' OpenTelemetry Collector syslog input module

module:

  name: otelCollectorInput

  title: OpenTelemetry Collector syslog input

  description: read events from the OpenTelemetry Collector over RFC5424 syslog (TCP or Unix socket)

  doc: '+include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/otel-collector/input/doc.md":""'

  allowMultiple: false

  options:

    - names:
        - otelCollectorInputPort
      description: TCP port to listen on for events from the OpenTelemetry Collector's syslog exporter
      type: String
      required: false
      defValue: 24226
      doc: |
        TCP port where Log10x listens for events sent by the OpenTelemetry
        Collector's `syslog` exporter (`network: tcp`, `protocol: rfc5424`).
        Match this against the `endpoint` + `port` in your Collector exporter
        block.

    - names:
        - otelCollectorInputPath
      description: Unix domain socket path to listen on (Linux/macOS)
      type: String
      required: false
      defValue:
      doc: |
        When set, Log10x listens on a Unix domain socket instead of TCP — useful
        on Linux/macOS to avoid TCP overhead. Configure the Collector's `syslog`
        exporter with `network: unix` and a matching `endpoint` path. Ignored
        on Windows.

    - names:
        - otelCollectorInputSyslog
      description: parse incoming bytes as RFC5424 syslog and extract MSG only
      type: String
      required: false
      defValue: "true"
      doc: |
        When `true` (the default), the input strips the RFC5424 syslog envelope
        and surfaces only the MSG field as the event text. Set to `false` if
        you've configured the Collector's `syslog` exporter to skip the
        RFC5424 envelope, or if you want to handle parsing downstream.
