#
# 🔟❎ 'run' Fluentd input modules

module:

  name: fluentd

  title: Fluentd input

  description: receive and optimize events collected by Fluentd forwarders

  # 'moduleSort' orders submodules in generated documentation. Each mode has
  # its own module (defined under sidecar/ and embedded/).
  moduleSort: [fluentdSidecar, fluentdEmbedded]

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/fluentd/doc.md":""

  # 'allowMultiple' is disabled — pipeline command line arguments and YAML configs
  # can specify a single value at most for each option defined below.
  allowMultiple: false

  # Shared output-formatting options used by both deployment modes (sidecar and
  # embedded). The two transports (forward / unix / stdio) reference these via
  # `$?fluentdOutputFields` and `$?fluentdOutputEncodeType` in their stream.yaml
  # so users set them once, regardless of which mode they pick.
  options:

    - names:
      - fluentdOutputFields
      description: list of TenXObject field names to include alongside the main event in output
      type: list
      required: false
      defValue: []
      doc: |
        specifies TenXObject field names to emit alongside the main event text
        when writing back to the Fluentd forwarder. When empty (default), only
        the main event field is written. Example fields: level, group, symbolMessage.

    - names:
      - fluentdOutputEncodeType
      description: "output format when outputFields are set. Possible values: [json, delimited]"
      type: string
      required: false
      defValue: delimited
      doc: |
        specifies how the combined output (main event field plus outputFields)
        is encoded when writing back to the Fluentd forwarder. Possible values:
        - **json**: formats all fields as a JSON object
        - **delimited**: formats field values separated by the output delimiter
        Only takes effect when fluentdOutputFields is set.
