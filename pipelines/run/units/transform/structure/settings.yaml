# 🔟❎ token parser settings

#  The 10x 'run' pipeline process breaks down log/trace events read as 
#  lines of text or selected by an input extractor into individual tokens.

# 'tokenDelims' defines which characters break a string of event characters into tokens to 
# classify as symbols or variables.
tokenDelims: $?tokenDelims=<>|. ][:-+/*=\\,{}_();'\"$\t\n@

# 'ipv4SingleToken' keeps a dotted-quad IPv4 address (e.g. 10.0.1.14) as one variable token
# instead of four numbers and three '.' delimiters. It has no default here on purpose: when the
# option is not set, the key is left out, so an engine that does not know the field still starts
# with these settings. The engine's own default is off.
ipv4SingleToken: $?ipv4SingleToken

# 'windowsPathSingleToken' keeps a Windows path (e.g. C:\Program Files\App\app.exe) as one variable token
# instead of its names, backslashes and punctuation. It has no default here on purpose: when the option is
# not set, the key is left out, so an engine that does not know the field still starts with these settings.
# The engine's own default is off.
windowsPathSingleToken: $?windowsPathSingleToken
