#
# 🔟❎ TenXTemplate token parser module

module:
  
  name: structure

  title: Structure parser

  description: structure input events into well-defined TenXObjects

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/units/transform/structure/doc.md":""

  # 'allowMultiple' is disabled for this module. Pipeline command line arguments and configuration files
  #  can specify a single value at max for each option defined below.
  allowMultiple: false
 
  # 'options' defines a group of named/typed configuration values to pass to a unit/module at startup
  #  via command line arguments (e.g., '> tenx -myA X -myB Y') or YAML launch files (e.g., '> tenx @my.config').
  #  Instances of this group passed are accessible at runtime via TenXEnv.get: https://doc.log10x.com/api/js/#TenXEnv.get
  options:
  
    - names:
      - tokenDelims
      description: token delimiters
      type: string
      required: false
      doc: |
        defines which characters break a string of event characters into tokens to classify as symbols or variables.
      defValue: <>|. ][:-+/*=\\,{}_();'\"$\t\n@
      

    - names:
      - ipv4SingleToken
      description: keep an IPv4 address as one value
      type: boolean
      required: false
      doc: |
        controls whether a dotted-quad IPv4 address (four numeric parts 0 to 255 joined by single dots,
        e.g. `10.0.1.14`) is kept as one variable token instead of four numbers and three '.' delimiters.
        A port or prefix length after the address (`10.0.1.14:443`, `10.0.0.0/8`) stays a separate value.
        These stay cut at their dots: a run of five or more dot-separated numbers, a run followed by `_`
        (`1.0.0.6_0`), a browser version after a word and `/` whose last three parts are 0 (`Chrome/125.0.0.0`),
        and a version next to `.jar` (`analyzer-3.2.0.0.jar:3.2.0.0`). Setting this option needs an engine
        that supports it; an older engine does not start when it is set.
      defValue: false
