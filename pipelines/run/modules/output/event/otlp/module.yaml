#
# 🔟❎ 'run' OTLP/gRPC logs output module

module:

  name: otlpOutput

  title: OTLP/gRPC logs output

  description: write TenXObject and template values to an OTLP/gRPC logs endpoint

  configFolder: run/output/event/otlp

  doc: '+include $=TenXEnv.get("docGenerate") ? "run/modules/output/event/otlp/doc.md":""'

  # Multiple OTLP outputs are supported via repeated `outputOtlp:` entries.
  allowMultiple: true

  options:

    - names:
        - outputOtlpHost
      description: host address of the target OTLP/gRPC logs endpoint
      type: string
      category: host
      required: false
      defValue: "127.0.0.1"
      doc: |
        Hostname or IP of the OpenTelemetry Collector (or other OTLP-compatible
        endpoint) accepting logs via OTLP/gRPC.

    - names:
        - outputOtlpPort
      description: TCP port of the target OTLP/gRPC logs endpoint
      type: string
      category: host
      required: false
      defValue: 4317
      doc: |
        TCP port of the OTLP/gRPC logs receiver. Matches the `endpoint` of the
        Collector's `otlp` receiver.

    - names:
        - outputOtlpInsecure
      description: if true, connect over plaintext (no TLS)
      type: string
      category: host
      required: false
      defValue: true
      doc: |
        When true, the gRPC channel is opened in plaintext mode (no TLS). Set
        to false only when the destination requires TLS.

    - names:
        - outputOtlpBodyField
      description: top-level field name to lift into the OTLP LogRecord body
      type: string
      category: encoding
      required: false
      defValue: body
      doc: |
        Name of the JSON field on each rendered event to set as the OTLP
        `LogRecord.body`. Other top-level fields are emitted as log-record
        attributes. Set to a non-existent field name to send all data as
        attributes (no body).

    - names:
        - outputOtlpTagField
      description: top-level field name to drop from output (synthetic envelope tag)
      type: string
      category: encoding
      required: false
      defValue: tag
      doc: |
        Name of the synthetic envelope tag field carried on the event. The
        appender drops this field on output so it does not surface as a
        log-record attribute on the destination side.

    - names:
        - outputOtlpBatchSize
      description: maximum number of LogRecords to buffer before flushing
      type: string
      category: encoding
      required: false
      defValue: 100
      doc: |
        When the buffered LogRecord count reaches this value, the appender
        immediately flushes via gRPC.

    - names:
        - outputOtlpFlushIntervalMs
      description: maximum age in ms of a buffered LogRecord before forced flush
      type: string
      category: encoding
      required: false
      defValue: 1000
      doc: |
        Periodic flush interval in milliseconds. Buffered LogRecords are
        flushed at most this often even when the batch size has not been
        reached. A longer interval lets more records coalesce into a single
        OTLP `ExportLogsServiceRequest`, which preserves the resource/scope
        grouping the destination Collector would see if Log10x weren't in
        the path.

    - names:
        - outputOtlpInflight
      description: most export requests outstanding at once
      type: string
      category: encoding
      required: false
      defValue: 4
      doc: |
        Number of `ExportLogsServiceRequest` calls the appender keeps open at
        once, retries included. When every one is outstanding and the buffer
        holds a full request, writing an event blocks until one is
        acknowledged, so the pipeline slows to the destination's pace instead
        of dropping records.

    - names:
        - outputOtlpRetryInitialMs
      description: delay in ms before the first retry of a failed export
      type: string
      category: encoding
      required: false
      defValue: 200
      doc: |
        A failed or timed-out export is retried with the same records until
        the destination accepts it. The delay starts at this value and doubles
        on each further failure, up to `outputOtlpRetryMaxMs`.

    - names:
        - outputOtlpRetryMaxMs
      description: longest delay in ms between retries of a failed export
      type: string
      category: encoding
      required: false
      defValue: 5000
      doc: |
        Upper bound of the doubling retry delay. Retries continue at this
        interval for as long as the destination keeps refusing.

    - names:
        - outputOtlpDeadlineMs
      description: time in ms an export may take before it counts as failed
      type: string
      category: encoding
      required: false
      defValue: 30000
      doc: |
        gRPC deadline of each export call. A destination that has not answered
        within it is treated as a failure and the export is retried. Keep it
        above the time the destination's slowest exporter takes to accept a
        request.

    - names:
        - outputOtlpFields
      description: list of TenXObject field names to encode
      type: list
      category: encoding
      required: false
      doc: |
        Names of TenXObject intrinsic/extracted/calculated fields to write on
        each event. With `outputOtlpEncodeType: delimited` and a single field
        carrying a JSON envelope (e.g. `fullText`), the appender re-parses the
        envelope to recover the original key/value structure.

    - names:
        - outputOtlpWriteObjects
      description: if true, emit TenXObject field values to this output
      type: string
      category: encoding
      required: false
      defValue: true
      doc: |
        Controls whether instance field values for TenXObjects passed to this
        output are written. Disable to keep templates-only emission active
        without ferrying every event payload over OTLP/gRPC.

    - names:
        - outputOtlpWriteTemplates
      description: if true, emit new TenXTemplates to this output
      type: string
      category: encoding
      required: false
      defValue: false
      doc: |
        Controls whether template values for TenXObjects passed to this output
        are written. Each new template is emitted at most once, as its own
        LogRecord with no body and the attributes `templateHash`, `template`
        and `tenx_tag` = `tenx-template`; route on `tenx_tag` to send templates
        and compact events to different destinations.
        The OpenTelemetry Collector forwarder input sets this on its own output
        whenever `receiverOptimize` is on. Passing `outputOtlpWriteTemplates` on
        the command line adds a second OTLP output at the default host and port
        (127.0.0.1:4317), which is the Receiver's own input on that path.

    - names:
        - outputOtlpFilter
      description: a JavaScript expression that an TenXObject must evaluate as 'truthy' against to be written to this output
      type: string
      category: encoding
      required: false
      doc: |
        Specifies a JavaScript expression that a TenXObject must evaluate as
        truthy to be written to this output. For example,
        `outputOtlpFilter: this.timestamp` will only emit TenXObjects whose
        intrinsic `timestamp` field is set.

    - names:
        - outputOtlpEncodeType
      description: the output format in which to encode TenXObject values. Possible values [json, delimited]
      type: string
      category: encoding
      required: false
      defValue: delimited
      doc: |
        Wire encoding used by the engine to render fields into the bytes the
        appender receives. The appender always parses the rendered text as
        JSON; with `delimited` and a single JSON-shaped field (`fullText`),
        the envelope is recovered intact.

    - names:
        - outputOtlpEncodeDelimiter
      description: the delimiter placed between key and values pairs if 'outputOtlpEncodeType' is 'delimited'
      type: string
      category: encoding
      required: false
      defValue: ','
      doc: |
        Delimiter used to separate TenXObject field values when
        `outputOtlpEncodeType` is `delimited`. Ignored when `outputOtlpEncodeType`
        is `json` (which emits a JSON object instead of delimited values).
