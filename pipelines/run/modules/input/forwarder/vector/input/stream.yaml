# 🔟❎ 'run' Vector socket input stream
#
# Listens for events from Vector's `socket` sink on TCP `:9000` by default
# (set `vectorInputPath` to use a Unix domain socket on Linux/macOS instead).
# Each event arrives as a newline-delimited JSON record produced by Vector's
# `encoding.codec: json` + `framing.method: newline_delimited` and is mapped
# to a TenXObject by the `vector` extractor below:
#
#   • The message text comes from the `message` field (or whatever
#     `vectorMessageField` is set to) and becomes the event's `text` — the
#     input to all downstream message-content enrichments.
#
#   • The tag stamped by Vector's ingest transform (default field name
#     `tag`, configurable via `vectorTagField`) becomes the event's
#     `source`, used for rate-based grouping and as the outgoing Fluent
#     Forward tag when events are sent back to Vector.
#
#   • The full record is preserved as `fullText` for verbatim downstream use.
#
# Unlike Fluentd, Vector has no `fluent`/`forward` sink — the ingest leg
# uses Vector's `socket` sink with NDJSON. The egress leg back to Vector
# does use Fluent Forward (Vector's `fluent` source consumes it).

tenx: run

runtimeAttributes:
  - fwd_input:vector

# ============================== Extractor ====================================

extractor:
  - name: vector
    type: json
    actions:
      # Capture the configurable message field as the event's text
      - $=yield "captureFirst:" + TenXEnv.get("vectorMessageField", "message")
      # Strip the `tag` field stamped by the ingest transform from the
      # record body — `sourcePattern` below has already extracted it as
      # the source, so the event going back out to Vector has the same
      # shape as the one that arrived.
      - drop:tag

# ============================== Input ========================================

input:

  - type: stream
    name: socket

    # Newline-delimited reader supporting TCP (port) or Unix socket (path)
    path: com.log10x.ext.edge.input.unix.UnixSocketInputStream

    # Apply the Vector extractor above; add the k8s extractor automatically
    # when the Receiver app sets `k8sExtractorName: fluentK8s`.
    extractors:
      - vector
      - "$=yield TenXEnv.get(\"k8sExtractorName\") ? \"fluentK8s\" : \"\""

    # Use the `tag` field stamped by Vector's ingest transform as the event's
    # source. Matches `"tag":"<value>"` in the NDJSON record. The field name
    # is fixed (Fluentd-style) — the recipe's `ingest` transform writes it.
    sourcePattern: \"tag\":\"(.*?)\"

    args:
      # Unix socket path takes precedence over TCP port when both are set
      - path
      - $=yield TenXEnv.get("vectorInputPath", "")
      - port
      - $=yield TenXEnv.get("vectorInputPort", "9000")
      # Vector does not wrap events in RFC5424 syslog — read plain JSON lines
      - syslog
      - false

    # Backpressure ceiling — Log10x stops draining the socket once this many
    # bytes have arrived in `intervalBytesDuration`, signalling Vector to
    # buffer instead of overwhelming the pipeline.
    backpressure:
      intervalBytesLimit: $=parseBytes("2MB")
      intervalBytesDuration: $=parseDuration("1s")
