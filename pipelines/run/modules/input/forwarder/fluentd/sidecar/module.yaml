#
# 🔟❎ Fluentd Sidecar module
#
# "Sidecar" mode runs Log10x as a peer process of Fluentd. The two exchange
# events over the native Fluent Forward protocol (TCP on Windows, optionally
# a Unix domain socket on Linux/macOS). Fluentd has no awareness of the
# Log10x binary — it simply has an `out_forward` writing to Log10x and an
# `in_forward` receiving processed events back.
#
# Recommended for:
#   • Kubernetes deployments (Log10x as a sidecar container on the same pod
#     as the Fluentd DaemonSet).
#   • Anyone using the official Fluentd Helm chart who wants a pure values
#     overlay rather than a forked chart.
#   • Local installs that prefer separate process lifecycles.
#
# For the alternative subprocess topology see ../embedded/module.yaml.

module:

  name: fluentdSidecar

  title: Fluentd Sidecar receiver

  description: receive events from Fluentd via the Fluent Forward protocol (peer-process topology)

  configFolder: run/input/forwarder/fluentd/sidecar

  doc: '+include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/fluentd/sidecar/doc.md":""'

  allowMultiple: false

  # Shared output-formatting options (fluentdOutputFields, fluentdOutputEncodeType)
  # live in the parent fluentd/module.yaml and are inherited by both modes.
