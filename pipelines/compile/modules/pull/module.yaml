#
# 🔟❎ 'compile' symbol scanner module
 
module:

  name: pull
  
  title: Repo Fetcher
  
  description: pull input source code/binary files from remote repositories
    
  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "compile/modules/pull/doc.md":""

  moduleSort: [github,docker,helm,artifactory,s3]

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: compile/pull

  # 'allowMultiple' is disabled for this module. Pipeline command line arguments and configuration files
  #  can specify a single value at max for each option defined below.
  allowMultiple: false

  # 'options' defines a group of named/typed configuration values to pass to a unit/module at startup
  #  via command line arguments (e.g., '> tenx -myA X -myB Y') or YAML launch files (e.g., '> tenx @my.config').
  options:

    - names:
      - s3Command
      description: path to the AWS CLI
      type: string
      required: false
      defValue: aws
      doc: |
        defines the [AWS CLI](https://docs.aws.amazon.com/cli/) program the [S3 bucket](https://doc.log10x.com/compile/pull/s3/) pull runs
        for listing and downloading objects: a program name on the path or a full path, with optional leading arguments (e.g., `aws --profile build`).
        
        The CLI's credential chain applies: environment, profile, instance or task role.
