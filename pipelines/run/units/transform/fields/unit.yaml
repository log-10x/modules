#
# 🔟❎ 'run' TenXTemplate JSON/KV field parser unit
 
unit:

  name: fieldParser

  title: Field parser

  description: scan TenXTemplates for JSON and KV fields
      
  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/units/transform/fields/doc.md":""

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/transform/fields

  # 'allowMultiple' is disabled for this unit. Pipeline command line arguments and configuration files
  #  can specify a single value at max for each option defined below.
  allowMultiple: false

  # 'optionsGroup' defines a group of named/typed configuration values to pass to a pipeline at startup
  #  via command line arguments (e.g., '> tenx -myA X -myB Y') or YAML launch files (e.g., '> tenx @my.config').
  #  Instances of this group passed to the pipeline are accessible at runtime via the TenXEnv JavaScript class.
  options:  

    - names:
      - fieldExtract
      description: scan TenXTemplate for nested JSON objects or key-value lists
      type: boolean
      required: false
      doc: |
        controls whether to scan TenXTemplates for JSON objects or key-value lists (e.g., `{"price": 10}` or `price=10`).
        
        TenXObjects instances of this template will provide access to these fields as named members (e.g., `this.price`).
        If a field appears more than once in [text](https://doc.log10x.com/api/js/#TenXBaseObject+text) it is accessible as an array (e.g., `this.price[1]`).
      defValue: true

    - names:
      - fieldNameBreaks
      description: KV field name terminator chars
      type: string
      required: false
      defValue: ', /\{}.()[]'     
      doc: |
        controls which 'text' characters left of a candidate token
        for being a 'key' in a KV field formation should serve as a terminator for the search. 
        
        For example, for an TenXObject whose [text](https://doc.log10x.com/api/js/#TenXBaseObject+text) contains the following entry ',tx_result=OK',
        the desired key should be 'tx_result', and so the name terminator character should be ',' vs. '_' (in which case
        the key would have been named 'result').

    - names:
      - fieldValueBreaks
      description: KV field value terminator chars
      type: string
      required: false
      defValue: '/\{}()[]'  
      doc: |
        controls which characters found to the right of a token
        whose is a candidate for being a 'value' in a KV field formation should serve 
        as a terminator for the search. 
        
        For example, for an object whose [text](https://doc.log10x.com/api/js/#TenXBaseObject+text) field
        contains the following entry: 'status=RESULT_SUCCESS' the desired KV value 
        should be 'RESULT_SUCCESS', and as such the value terminator character 
        should be ',' vs. '_' (in which case the value would be 'RESULT').

    - names:
      - fieldReaders
      description: "the readers that find a template's fields, in order. Possible values: [xml, kv, json, columns]"
      type: list
      required: false
      doc: |
        The readers that find the fields of each TenXTemplate, tried in order; the
        first that reads the template's text gives its fields. When set, these
        readers replace the JSON and key-value scan above for every consumer of
        the fields. Unset (the default), the scan above finds the fields.

        - **xml**: a text that is one XML element. Names are paths of local names
          joined by `.`, such as `Event.System.EventID`; an attribute is named
          after its element, such as `Event.System.Execution.ProcessID`.
        - **kv**: `name=value` pairs separated by `fieldPairDelimiters`. A value that
          opens with `"` runs to the next `"` not escaped by a backslash.
        - **json**: a text that is one JSON object or array. Names are key paths
          joined by `.`, with `[]` for each array a value is in, such as
          `userIdentity.arn` or `resources[].ARN`.
        - **columns**: delimited columns named by position from `fieldColumns`.

        The fields are found once per template. An event of the template reads
        each value from its own text at the same place. When the readers cannot
        be sure of a field in an event, no consumer gets it. A lookup finds it
        missing, and `compactFields` writes the event whole.

        When several readers are listed, put `xml` and `json` first. `kv` and
        `columns` read almost any line, so a reader listed after them is not tried.

    - names:
      - fieldPairDelimiters
      description: the characters that separate key-value pairs for the kv field reader
      type: string
      required: false
      defValue: ' ,'
      doc: |
        The characters that end an unquoted value and separate pairs for the `kv`
        reader. A line feed always separates pairs. The default is a space and a
        comma. Each must be a token delimiter (`tokenDelims`) other than `=`, `"`,
        `\` or `-`, or the launch stops.

    - names:
      - fieldColumns
      description: the column names for the columns field reader
      type: list
      required: false
      doc: |
        The names of the columns the `columns` reader reads, in order, separated by
        commas, such as `receive_time,serial,type`. An empty name leaves its
        column unnamed. Columns past the last name are not read.

        To name the columns by the value of one column, give one entry per value,
        such as `TRAFFIC=future_use1,receive_time,serial,type` and
        `THREAT=future_use1,receive_time,serial,type`, and set `fieldColumnsKey`.
        An entry without `=` applies to any other value.

    - names:
      - fieldColumnsKey
      description: the column, counted from 1, whose value selects a fieldColumns list
      type: number
      required: false
      defValue: 0
      doc: |
        The column, counted from 1, whose value selects the `fieldColumns` entry
        that names a line's columns. 0 (the default) uses the one entry without a value.

    - names:
      - fieldColumnDelimiter
      description: the character that separates columns for the columns field reader
      type: string
      required: false
      defValue: ','
      doc: |
        The character that separates columns. It must be a token delimiter
        (`tokenDelims`) other than `"`, `-` or a line break, or the launch stops. A
        column that opens with `"` runs to its closing quote, and `""` inside it
        is one quote.

    - names:
      - fieldNameAttributes
      description: XML elements whose attribute names their value, as element@attribute
      type: list
      required: false
      doc: |
        XML elements named by one of their attributes instead of their own name, as
        `element@attribute`. With `Data@Name`, the Windows event element
        `<Data Name='SubjectUserName'>bob</Data>` gives the field
        `Event.EventData.SubjectUserName` with the value `bob`.

    - names:
      - compactFields
      description: the fields each compact event carries beside it, as name or name=outputName
      type: list
      required: false
      doc: |
        The fields of each event that `encode()` writes beside its compact form in
        its record. A destination can then index them without expanding the event.
        Each entry is a field name as the template's field readers name it (see
        `fieldReaders`). An entry `name=outputName` writes it under another name,
        such as `Event.EventData.NewProcessName=process_path`. Two entries cannot
        share an output name, and the launch stops when `fieldReaders` is not set.

        The fields are read from each event's text where its template places
        them, and an empty value is left out. An event is written whole
        (`fullText`) when:

        - `noTemplate`: it has no template, or it is already compact;
        - `group`: it is a group of several lines;
        - `noRecord`: the output writes no JSON record, as for raw lines, so every event is written whole;
        - `recordKey`: its record already has a key named `compactFieldsKey`;
        - `notRead`: no field reader reads its template;
        - `structure`: its text differs from its template's where names are read;
        - `uncertain`: the reader cannot tell where a listed field's name or value ends;
        - `repeated`: a listed field occurs twice, other than as JSON array elements, which
          are written as a list;
        - `value`: a value, or a name read from the event, does not decode;
        - `tooLong`: a value is longer than `compactFieldsMaxValue`;
        - `unsafe`: a value holds a character that `compactFieldsUnsafeChars` matches.

        `compactFieldsWhole()` returns the reason's name, and an empty string
        for an event written compact. Unset (the default), `encode()`
        writes no fields.

    - names:
      - compactFieldsForm
      description: "how compactFields are written in the record. Possible values: [object, text]"
      type: string
      required: false
      defValue: object
      doc: |
        - **object** (the default): a JSON object under `compactFieldsKey`, such as
          `"fields":{"user":"bob","tags":["a","b"]}`.
        - **text**: one string under `compactFieldsKey` of `name<separator>"value"`
          pairs separated by spaces, with `\` and `"` in a value escaped by a
          backslash, such as `"meta":"user::\"bob\""` with the separator `::`.

    - names:
      - compactFieldsKey
      description: the record key compactFields are written under
      type: string
      required: false
      defValue: fields
      doc: |
        The key of the record that holds the fields. An event whose record already
        has a key of that name is written whole. The launch stops when `encode()`
        itself adds one, as `encode("routeState")` adds `routeState`.

    - names:
      - compactFieldsSeparator
      description: the text between a name and its value in the text form of compactFields
      type: string
      required: false
      defValue: "="
      doc: |
        The text between a field's name and its quoted value when `compactFieldsForm`
        is `text`.

    - names:
      - compactFieldsMaxValue
      description: the longest value compactFields writes; an event with a longer one is written whole
      type: number
      required: false
      defValue: 1000
      doc: |
        The most characters of a field value. An event with a longer value is
        written whole.

    - names:
      - compactFieldsDecode
      description: whether compactFields values are decoded or written as their text stands in the event
      type: boolean
      required: false
      defValue: true
      doc: |
        `true` (the default) writes each value decoded by its format: JSON escapes,
        XML entities and quoted pair escapes. `false` writes the value's text as it
        stands in the event, for a destination that reads it that way.

    - names:
      - compactFieldsTrim
      description: whether compactFields values lose white space at both ends
      type: boolean
      required: false
      defValue: false
      doc: |
        `true` leaves out spaces, tabs and line breaks at both ends of each value,
        for a destination whose own extraction trims them. A value left empty is
        not written.

    - names:
      - compactFieldsUnsafeChars
      description: a regular expression for the characters a compactFields value must not hold
      type: string
      required: false
      defValue: '[\x00-\x1f]'
      doc: |
        A Java regular expression that matches one character, such as `'[\x00-\x1f]'`.
        An event with a listed value that holds such a character is written whole,
        in either `compactFieldsForm`. This is for a destination that reads some
        characters in an indexed value back as others, such as a tab as a space.
        The default matches every control character. In a YAML file, write the
        expression in quotes, since an unquoted `[...]` is a list.
