# 🔟❎ Fluent Bit multiline parser for the Log10x sidecar
#
# Joins multi-line events (stack traces, messages that span lines) in the
# tail input, so each record Fluent Bit sends to Log10x is one event and the
# Receiver runs with `groupJoinLines false`. Load it with `Parsers_File` and
# set `multiline.parser event_start` on each tail input.
#
# An event starts at a line that starts with a date; every other line joins
# the event before it. Change both rules to match the first line of the events
# in your logs.

[MULTILINE_PARSER]
    Name          event_start
    Type          regex
    Flush_Timeout 1000
    Rule          "start_state"  "/^\d{4}-\d{2}-\d{2}/"        "cont"
    Rule          "cont"         "/^(?!\d{4}-\d{2}-\d{2})/"    "cont"
