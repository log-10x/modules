#
# 🔟❎ 'run' Vector Forward output module

module:

  name: vectorOutput

  title: Vector Fluent Forward output

  description: send processed events back to Vector over the Fluent Forward protocol

  doc: '+include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/vector/output/doc.md":""'

  allowMultiple: false

  options:

    - names:
        - vectorOutputHost
      description: TCP host of the Vector fluent source receiving processed events
      type: String
      required: false
      defValue: 127.0.0.1
      doc: |
        Hostname or IP where Vector's `fluent` source is listening for
        processed events from Log10x. Pairs with `vectorOutputPort`.

    - names:
        - vectorOutputPort
      description: TCP port of the Vector fluent source receiving processed events
      type: String
      required: false
      defValue: 9001
      doc: |
        TCP port where Vector's `fluent` source is listening for processed
        events from Log10x. MUST differ from the port Log10x's own socket
        input listens on (default `9000`) or the two would collide on the
        same listener.

    - names:
        - vectorOutputPath
      description: Unix domain socket path of the Vector fluent source (Linux/macOS)
      type: String
      required: false
      defValue:
      doc: |
        Optional Unix domain socket path for Vector's `fluent` source.
        When set, takes precedence over `vectorOutputHost` / `vectorOutputPort`.
        Linux/macOS only — ignored on Windows.
