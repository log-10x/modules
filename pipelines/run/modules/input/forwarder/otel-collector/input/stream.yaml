# 🔟❎ 'run' OpenTelemetry Collector OTLP/gRPC input stream
#
# Listens for OTLP/gRPC log records from the OpenTelemetry Collector's `otlp`
# exporter on TCP `:4317` by default. Each `ExportLogsServiceRequest` is
# flattened so that resource attributes, scope attributes, log-record
# attributes, and the body all become top-level fields on the JSON record
# that the engine sees as fullText.

tenx: run

runtimeAttributes:
  - fwd_input:otel-collector

# ============================== Extractor ====================================

extractor:
  - name: otel
    type: json
    actions:
      - $=yield "captureFirst:" + TenXEnv.get("otelCollectorMessageField", "body")
      - drop:tag

# ============================== Input ========================================

input:

  - type: stream
    name: otelCollector

    path: com.log10x.ext.edge.input.otlp.OtlpLogsInputStream

    extractors:
      - otel
      - "$=yield TenXEnv.get(\"k8sExtractorName\") ? \"fluentK8s\" : \"\""

    sourcePattern: \"tag\":\"(.*?)\"

    args:
      - port
      - $=yield TenXEnv.get("otelCollectorInputPort", "4317")

    backpressure:
      intervalBytesLimit: $=parseBytes("2MB")
      intervalBytesDuration: $=parseDuration("1s")
