#
# 🔟❎ 'run' compact receiver module

module:

  name: compactReceiver

  title: compact receiver

  description: Per-container compaction decision via a declarative cap-file. Decides whether each event is emitted via encode() (compact templateHash+vars form, ~50-80% volume reduction) or as fullText. GitOps-controlled — the MCP writes per-container entries via PR, engine hot-reloads the cap-file without restart.

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/receive/compact

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/receive/compact/doc.md":""

  allowMultiple: false

  options:

    - names:
      - compactReceiverLookupFile
      description: path or URL to a per-container compact decisions cap-file
      type: string
      required: false
      doc: |
        points the engine at a cap-file whose entries decide whether each
        container's events are compacted via `encode()` or preserved as
        `fullText`. Containers not listed fall back to `compactReceiverDefault`.

        The container identity is the value of `compactReceiverContainerField`
        (defaults to the k8s container name), so listed entries are stable
        across pod replicas.

        **File format** (CSV; header row + one comma-separated entry per row):

        ```
        container,value
        <container>,<true|false>[:<untilEpochSec>][:<reason>]
        ```

        - `container` — value of `compactReceiverContainerField` for the events
          to act on. In k8s this is the k8s container name.
        - `value` — `true` (compact via `encode()`) or `false` (explicitly
          preserve `fullText` for this container, beating the default).
        - `untilEpochSec` — optional Unix-epoch (seconds) expiry. Past it the
          entry becomes a no-op and the container falls back to
          `compactReceiverDefault`.
        - `reason` — optional free-text for audit. Must not contain commas
          (would break CSV parsing).

        **Example**:

        ```
        container,value
        payment-service,true:1735689600:high-volume PAY-101
        auth-service,true
        istio-proxy,false:1735689600:keep verbose during incident PLAT-42
        ```

        The file is hot-reloaded on in-place writes (the gitops pattern); a
        Kubernetes `ConfigMap` mount won't reload because the CM swap is a
        symlink rename, not an in-place write.

    - names:
      - compactReceiverLookupRetain
      description: retention period for the per-container cap-file before it is considered stale
      type: number
      required: false
      doc: |
        defines the retention period (in milliseconds) for the cap-file
        (`compactReceiverLookupFile`). If the file's last modified time is
        older than this period, a warning is logged. The cap entries continue
        to apply; the staleness check is advisory so operators notice when an
        automated tooling pipeline has stopped updating the file.

        **Validation**: must be greater than 60000ms (1 minute).
      defValue: 300000

    - names:
      - compactReceiverContainerField
      description: event field whose value scopes the cap-file lookup
      type: string
      required: false
      doc: |
        defines the event field whose value is used as the cap-file lookup
        key. Defaults to the k8s container name (`k8s_container`), so listed
        entries are stable across pod replicas and a sidecar never inherits
        the application container's compaction decision.

        Set to any extracted field to scope by something else (service,
        deployment, tenant, etc.). The same value should appear both as the
        first column of `compactReceiverLookupFile` entries and as a field
        on every event the receiver sees.
      defValue: k8s_container

    - names:
      - compactReceiverDefault
      description: fallback compaction decision when no cap-file entry applies
      type: boolean
      required: false
      doc: |
        controls the fallback decision when no cap-file is loaded, no entry
        matches an event's container, or a matching entry has expired.

        - `false` (default) — preserve `fullText`. Cap-file entries opt
          specific containers INTO compaction.
        - `true` — compact via `encode()`. Cap-file entries opt specific
          containers OUT (e.g., audit/compliance containers that must stay
          verbose).

        Flipping this value is a policy-level decision (affects every event),
        not a cap-file edit. Changing it requires a pod rollout. The cap-file
        handles per-container overrides without restart.
