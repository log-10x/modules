#
# 🔟❎ 'run' Vector input module
#
# Sidecar-only integration. Log10x runs as a peer process to Vector; Vector
# sends events to Log10x over its native `socket` sink (newline-delimited
# JSON) and receives processed events back via its native `fluent` source
# (Fluent Forward protocol). The two protocols are asymmetric because
# Vector has no `fluent`/`forward` sink — only a `fluent` source.

module:

  name: vector

  title: Vector

  description: receive and optimize events collected by Vector via the socket sink and fluent source

  moduleSort: [vectorInput, vectorOutput]

  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/vector/doc.md":""

  allowMultiple: false

  # Shared output-formatting options used by the Vector Forward output.
  options:

    - names:
      - vectorOutputFields
      description: list of TenXObject field names to include alongside the main event in output
      type: list
      required: false
      defValue: []
      doc: |
        specifies TenXObject field names to emit alongside the main event text
        when writing back to Vector. When empty (default), only the main event
        field is written. Example fields: level, group, symbolMessage.

    - names:
      - vectorOutputEncodeType
      description: "output format when outputFields are set. Possible values: [json, delimited]"
      type: string
      required: false
      defValue: delimited
      doc: |
        specifies how the combined output (main event field plus outputFields)
        is encoded when writing back to Vector. Possible values:
        - **json**: formats all fields as a JSON object
        - **delimited**: formats field values separated by the output delimiter
        Only takes effect when vectorOutputFields is set.
