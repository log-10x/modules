# 🔟❎ 'run' Vector Fluent Forward output stream
#
# Sends processed events back to Vector over the Fluent Forward protocol —
# Vector's `fluent` source consumes Forward natively. The tag stamped on
# the way in (default field `tag`, configurable via `vectorTagField`) is
# restored on the Forward wire, so destinations that route on the tag
# behave the same as without Log10x in the path.
#
# Defaults to TCP `127.0.0.1:9001` so it pairs with the Vector socket
# input listening on `:9000`. Override with:
#
#   vectorOutputHost: 0.0.0.0
#   vectorOutputPort: 9999
#
# Or use a Unix domain socket on Linux/macOS:
#
#   vectorOutputPath: /tmp/tenx-vector-out.sock
#
# The output mode is driven by `outputEncodeField` and `outputWriteTemplates`
# (see run/modules/input/forwarder/module.yaml):
#
#   receive  (default)               → emit the verbatim event (`fullText`)
#   compact  (receiverOptimize=true) → emit losslessly compacted events +
#                                       the TenXTemplates needed to decode them

tenx: run

include:
  - run/modules/output/event/forward

outputForward:

  - hostAddress: $=yield TenXEnv.get("vectorOutputHost", "127.0.0.1")
    hostPort: $=yield TenXEnv.get("vectorOutputPort", "9001")
    address: $=yield TenXEnv.get("vectorOutputPath")

    fields:
      # Carries the whole Vector record in receive mode and an encoded
      # form in compact mode. Picked automatically based on the Receiver
      # app's mode (`receiverOptimize`, `compactReceiverLookupFile`,
      # `symbolMessageHashField`).
      - $?outputEncodeField=fullText

    # Emit each top-level field of the rendered record as its own field on
    # the outgoing Forward event — so the record structure of the original
    # Vector event survives the round trip.
    encodeType: $?vectorOutputEncodeType=delimited

    writeTemplates: $?outputWriteTemplates=false
