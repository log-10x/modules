# ─────────────────────────────────────────────────────────────────────────────
# Log10x Logstash sidecar — ingest pipeline
# ─────────────────────────────────────────────────────────────────────────────
#
# This is the `ingest` pipeline referenced from pipelines.yml. It owns the
# sources, the enrichment filter chain, and the handoff to the Log10x sidecar
# via a `tcp` output with `codec => json_lines`. Each event flows:
#
#   sources ──► enrichment filters ──► tcp output ──► Log10x:5044
#                                                          │
#                                                          ▼
#                                                       Receiver
#                                                          │
#   destinations ◄── tcp input ◄── Log10x (:5045) ─────────┘  (see tenx-destinations.conf)
#
# The `destinations` pipeline (separate `.conf` file) consumes returning
# events and routes to your real outputs. Filters defined here never re-fire
# on the return path — Logstash's pipeline boundary keeps the two filter
# chains isolated. That structural separation is the bypass.

input {
  # Replace this `file` block with your own sources (`beats`, `tcp`, `http`,
  # `syslog`, …). Everything that should be processed by Log10x flows
  # through this pipeline's filter chain and out via the `tcp` output below.
  file {
    id    => "in_file_example"
    path  => "/var/log/containers/*.log"
    codec => "json"
    start_position => "beginning"
  }
}

filter {
  # Put all your enrichment filters here — `grok`, `mutate`, `kv`, `date`,
  # `geoip`, `kubernetes`, etc. They run exactly once per event before the
  # handoff to Log10x. The return path is a different pipeline, so they
  # never double-fire.
  mutate {
    id          => "ingest_enrich"
    add_field   => { "cluster" => "${CLUSTER_NAME:unset}" }
    # `tag` (a top-level record field, NOT Logstash's `[@metadata]` or
    # `tags` array) is what the Log10x input reads as the event's source.
    # Set it to any expression that identifies the stream — the source
    # name, the file path, etc. The recipe defaults to a static value;
    # in production, derive it from `[source]` or `[fileset][name]`.
    add_field   => { "tag" => "logstash" }
  }
}

output {
  # Hand off to the Log10x sidecar. On Linux/macOS swap `tcp` for the
  # `unix` output plugin and point `path` at a Unix domain socket.
  tcp {
    id    => "out_to_tenx"
    host  => "127.0.0.1"
    port  => 5044
    codec => json_lines
  }
}
