# 🔟❎ 'run' Fluentd Forward output stream configuration (sidecar topology)
#
# Composes the generic run/modules/output/event/forward output with
# Fluentd-conventional defaults — so the user-facing sidecar launch config
# just includes this module and doesn't need an inline `outputForward:` block.
#
# Address / port defaults to 127.0.0.1:24225, the conventional port for the
# Fluentd `in_forward` source that pairs with the Log10x forward input on
# 24224. To override, set the generic options in the launch config:
#
#   outputForwardHostAddress: 0.0.0.0
#   outputForwardHostPort:    9999
#
# Or for a Unix socket on Linux/macOS:
#
#   outputForwardAddress:     /tmp/tenx-fluentd-out.sock
#
# Mode is selected by `outputEncodeField` and `outputWriteTemplates` — see
# run/modules/input/forwarder/module.yaml for the shared-option model.

# Set the 10x pipeline to 'run'
tenx: run

# =============================== Dependencies ================================

include:

  # Load the generic Forward protocol output module
  - run/modules/output/event/forward

# ============================= Output Options ================================

# Single forward output instance. The generic output module's `foreach`
# iterates over instances declared here. Fluentd-flavored field/encoding
# defaults are applied here once so the launch config stays clean.
outputForward:

  - hostAddress: 127.0.0.1
    hostPort: 24225

    fields:
      - $?outputEncodeField=fullText
      - $?fluentdOutputFields

    encodeType: $?fluentdOutputEncodeType
    encodeDelimiter: ","

    writeTemplates: $?outputWriteTemplates=false
