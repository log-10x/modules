#
# 🔟❎ 'run' Message lookup module

module:

  name: symbolLookup

  title: Symbol Message Calculator

  description: enrich TenXObjects with logical message symbol sequence and origin values

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/initialize/message

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: '+include $=TenXEnv.get("docGenerate") ? "run/modules/initialize/message/doc.md":""'
 
  # 'allowMultiple' is disabled for this module. Pipeline command line arguments and configuration files
  #  can specify a single value at max for each option defined below.
  allowMultiple: false
        
  # 'options' defines a group of named/typed configuration values to pass to a unit/module at startup
  #  via command line arguments (e.g., '> tenx -myA X -myB Y') or YAML launch files (e.g., '> tenx @my.config').
  #  Instances of this group passed are accessible at runtime via TenXEnv.get: https://doc.log10x.com/api/js/#TenXEnv.get
  options:

    - names:
      - symbolContexts
      description: types of symbols to search
      type: string
      required: false
      doc: |
        Specifies a comma delimited list of [symbol contexts](https://doc.log10x.com/run/transform/symbol/#contexts) values.

        This is argument is passed as the `symbolContexts` argument value for the [symbolSequence](https://doc.log10x.com/api/js/#TenXObject+symbolSequence) function.

        The listed contexts are evaluated in a single pass, so list order acts as a filter rather than a precedence chain.

      defValue: log,exec

    - names:
      - symbolMaxLen
      description: max number of output chars 
      type: number
      required: false
      defValue: 0
      doc: |
        Specifies the max number of chars of the [symbolMessageField](https://doc.log10x.com/run/initialize/message/#symbolmessagefield). 
        Set 0 to unlimited.
        
    - names:
      - symbolMessageField
      description: field name to assign with symbol sequence value
      type: string
      required: false
      doc: |
         specifies the name of the field to assign the return value of [symbolSequence](https://doc.log10x.com/api/js/#TenXObject+symbolSequence) function
         when invoking it with the a symbolContext argument value of [symbolContexts](https://doc.log10x.com/run/initialize/message/#symbolcontexts).

         For an example, see [symbolInputField](https://doc.log10x.com/run/initialize/message/#symbolinputfield).
      defValue: symbolMessage

    - names:
      - symbolMessageHashField
      description: field name to assign with the hash of the symbol sequence value
      type: string
      required: false
      doc: |
         specifies the name of the field to assign a stable, URL-safe hash of the
         [symbolMessageField](https://doc.log10x.com/run/initialize/message/#symbolmessagefield) value,
         computed via [TenXString.hash](https://doc.log10x.com/api/js/#TenXString.hash).

         The value is an 11-character base64url identifier (xxHash64 of the UTF-8
         bytes, big-endian, no padding). It is one-way and reproduces byte-for-byte
         outside the engine, so it is safe to use directly as a deduplication key,
         metric dimension, analyzer query term, or forwarder filter key.

         **Unset by default.** The enrichment field itself is always present on the
         TenXObject under the internal name `tenx_hash`, so metrics dimensions, the
         aggregation key and the MCP artifacts carry the pattern hash whether or not
         this option is set. What the option controls is the *wire* name, and with it
         whether the hash reaches a coupled log forwarder: on the
         [forwarder receive path](https://doc.log10x.com/run/input/forwarder/) the
         record goes back to the forwarder byte-for-byte as it arrived unless this
         option names a field, and then that field is spliced onto the returned record.

         Set it to `tenx_hash` to get the historical name, or to any other name to
         both rename the enrichment field and ship it, for example
         `symbolMessageHashField my_custom_hash`.

    - names:
      - symbolOriginField
      description: field name to assign with symbol message origin file
      type: string
      required: false
      doc: |
         specifies the name of the field to assign the return value of [symbolOrigin](https://doc.log10x.com/api/js/#TenXObject+symbolOrigin) function.
      defValue: ""

    - names:
      - messageNegators
      description: list of strings that, when matched at the start of a log line's text, mark it as low-value continuation/boilerplate that does NOT receive its own message pattern.
      type: list
      required: false
      doc: |
        A list of strings that, when matched at the start of a log line's text, mark it as a known
        continuation pattern (e.g., stack trace frame, indented detail, banner) that should not
        receive its own message pattern.

        Negators have two consumers. The message template's gate evaluates them when the event is
        neither part of a multi-event group (groupSize > 1) nor a group head: in that case, an
        event still receives a pattern unless it matches a negator. This is the "Hello World vs
        orphan stack frame" discriminator. The group template's head detection also consults them
        as a veto BETWEEN the timestamp and severity checks: a negator-prefixed line cannot be
        promoted to group head by severity inference alone (a token like `info` inside an object
        dump), so continuation fragments weld into their parent instead of minting orphan heads.
        Both consumers are inert until this list is configured — there is no default.

        - ` ` - any indented line (universal continuation signal).
        - `	` - any tab-prefixed line (Java/Go stack frames etc.).
        - `Caused by: ` - Java chained exception (column 0).
        - `Suppressed: ` - Java suppressed exception (column 0).
        - `--- End of ` - .NET inner exception marker.
        - `created by ` - Go goroutine creator.
        - `#0 `..`#5 ` - PHP stack frames (depth 0-5).
