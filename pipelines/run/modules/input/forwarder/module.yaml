#
# 🔟❎ 'run' forwarder input modules

module:

  name: forwarderInputs

  title: Log Forwarder inputs

  description: report, receive and optimize events collected by log forwarders

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/doc.md":""

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/input/forwarder

  moduleSort: [fluentbit,fluentd,otelCollector,vector,filebeat,logstash,splunkUF,datadogAgent]

  # Shared options applicable across all forwarder flavors. Mode selection
  # (receive / compact-all / compact-lookup) is driven by outputEncodeField,
  # which each forwarder's user-facing config.yaml derives from `receiverOptimize`
  # and `compactReceiverLookupFile` via a `$=yield` expression. Substitution
  # into the transport stream.yaml happens at config-load before DSL parse, so
  # `shouldEncode()` only appears in the parsed field expression when the
  # compact lookup is actually configured — and CompactObject only loads under
  # that same condition.
  options:

    - names:
      - outputEncodeField
      description: the single field expression each forwarder's output stream writes per event
      type: string
      required: false
      defValue: fullText
      doc: |
        Selected per forwarder mode by the user-facing config.yaml:

        - **receive** (default): `fullText` — plain passthrough, no encoding
        - **compact-all**: `encoded=encode()` — every event compacted
        - **compact-lookup**: `encoded=shouldEncode() ? encode() : fullText` — per-pattern
          decision via the compactReceiver module (requires `compactReceiverLookupFile`)

        Advanced users can override directly to customize the output field expression.

    - names:
      - outputWriteTemplates
      description: whether the forwarder emits new TenXTemplates alongside encoded events
      type: string
      required: false
      defValue: "false"
      doc: |
        True for encoding modes (compact-all, compact-lookup) so decoders can
        reconstruct events from templateHash + vars. False for receive mode
        (no encoding → no templates needed).

    - names:
      - outputSoftDrop
      description: soft/hard toggle for regulator-dropped events (truthy = soft, unset = hard)
      type: string
      required: false
      doc: |
        The single soft/hard knob. The regulator only marks `isDropped`; this flag
        tells the output stream what to do with a marked event:

        - **unset (default) = hard-drop**: the stream filter is `isObject && !isDropped`,
          so a dropped event is NOT written (saves ingest + index).
        - **truthy = soft-drop**: the stream filter is `isObject` (everything is written)
          and the output field becomes `isDropped ? encode() : fullText`, so dropped
          events are emitted losslessly compacted instead of in full.

        Use truthiness, not string equality (the engine's string `==` is identity
        compare): set it to a non-empty value (e.g. `true`) for soft, leave unset for hard.

    - names:
      - outputDropFilter
      description: the filter expression each output stream uses to decide whether a marked object is written
      type: string
      required: false
      defValue: isObject && !this.isDropped
      doc: |
        Resolved once by the user-facing config.yaml from `outputSoftDrop`, so the
        soft/hard logic lives in one place instead of being duplicated per stream:

        - **hard** (default): `isObject && !this.isDropped` — dropped objects not written
        - **soft** (`outputSoftDrop` truthy): `isObject` — everything written; the
          output field compacts the dropped ones

        Each output stream references it via `$?outputDropFilter`. Named outputDropFilter
        rather than outputFilter, which is a built-in per-stream engine option.
