#
# 🔟❎ 'run' Fluent Bit input module
#
# Sidecar-only integration. Log10x runs as a peer process to Fluent Bit; the
# two exchange events over the native Fluent Forward protocol in both
# directions. No Lua filter / `io.popen()` subprocess pattern is supported.

module:

  name: fluentbit

  title: Fluent Bit

  description: receive and optimize events collected by Fluent Bit via the Fluent Forward protocol

  moduleSort: [fluentbitInput, fluentbitOutput]

  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/fluentbit/doc.md":""

  allowMultiple: false

  # Shared output-formatting options used by the Fluent Bit Forward output.
  options:

    - names:
      - fluentbitOutputFields
      description: list of TenXObject field names to include alongside the main event in output
      type: list
      required: false
      defValue: []
      doc: |
        specifies TenXObject field names to emit alongside the main event text
        when writing back to Fluent Bit. When empty (default), only the main
        event field is written. Example fields: level, group, symbolMessage.

    - names:
      - fluentbitOutputEncodeType
      description: "output format when outputFields are set. Possible values: [json, delimited]"
      type: string
      required: false
      defValue: delimited
      doc: |
        specifies how the combined output (main event field plus outputFields)
        is encoded when writing back to Fluent Bit. Possible values:
        - **json**: formats all fields as a JSON object
        - **delimited**: formats field values separated by the output delimiter
        Only takes effect when fluentbitOutputFields is set.
