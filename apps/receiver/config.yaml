# 🔟❎ 'run' Receiver settings

# This configuration defines the settings for use by the Receiver app.
# When 'reducerReadOnly' is true the receiver runs in read-only mode (emits
# metrics, does not write back to the forwarder). When 'reducerOptimize' is
# true the receiver runs in compact mode (encodes events for volume reduction).
# To learn more see https://doc.log10x.com/apps/receiver
#
# Note: the runtimeAttribute below stays as `app:reducer` so the Prometheus
# label `tenx_app="reducer"` is unchanged across the rename. The product name
# is "Receiver" everywhere except this one internal label, which preserves
# all existing metrics queries.

tenx: run

# ============================= App Settings ==================================

runtimeAttributes:
  - app:reducer
  - env:edge

include:
  - apps/shared
  - run/aggregate/regulate # https://doc.log10x.com/run/aggregate/#regulate
