#
# 🔟❎ 'run' forwarder input modules

module:

  name: forwarderInputs

  title: Log Forwarder inputs

  description: report, receive and optimize events collected by log forwarders

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/doc.md":""

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/input/forwarder

  moduleSort: [fluentbit,fluentd,otelCollector,vector,filebeat,logstash,splunkUF,datadogAgent]

  # Shared options applicable across all forwarder flavors.
  #
  # The regulator-dropped behavior is controlled by two orthogonal booleans
  # the user sets directly:
  #
  #   emit_dropped     = does the regulator-marked slice survive the output filter?
  #   compact_emitted  = do all emitted events emit as encode() bytes or as fullText?
  #
  # They compose into four coherent behaviors:
  #
  #   emit_dropped | compact_emitted | behavior
  #   -------------|-----------------|--------------------------------------------------
  #   false        | false           | hard-drop the bad ones. Kept events emit fullText.
  #   false        | true            | hard-drop the bad ones. Kept events emit compacted.
  #   true         | false           | emit everything fullText. Forwarder routes by `routeState`.
  #   true         | true            | emit everything compacted. (niche)
  #
  # `routeState` is always written as a top-level field on the wire, so the
  # downstream forwarder can route by it regardless of which combination is set.
  # The customer-facing config.yaml maps these two flags into the engine's
  # internal `outputDropFilter` and `outputEncodeField` primitives via $=yield
  # expressions — see the receiver app config for the canonical wiring.
  options:

    - names:
      - outputEncodeField
      description: the single field expression each forwarder's output stream writes per event
      type: string
      required: false
      defValue: fullText
      doc: |
        Derived by the customer-facing config.yaml from `compact_emitted` (and
        from the legacy per-pattern `compactReceiverLookupFile` lookup when set):

        - **compact_emitted=false** (default): `fullText` — every event passes through full text
        - **compact_emitted=true**: `encoded=encode()` — every emitted event compacted losslessly
        - **compact-lookup (legacy)**: `encoded=shouldEncode() ? encode() : fullText` —
          per-pattern decision via the compactReceiver module (requires
          `compactReceiverLookupFile`)

        Advanced users can override directly to customize the output field expression.

    - names:
      - outputWriteTemplates
      description: whether the forwarder emits new TenXTemplates alongside encoded events
      type: string
      required: false
      defValue: "false"
      doc: |
        True for encoding modes (compact-all, compact-lookup) so decoders can
        reconstruct events from templateHash + vars. False for receive mode
        (no encoding → no templates needed).

    - names:
      - emit_dropped
      description: whether regulator-marked (`routeState="drop"`) events survive the output filter
      type: string
      required: false
      doc: |
        Single boolean controlling whether the regulator-dropped slice reaches the
        forwarder. Orthogonal to `compact_emitted`.

        - **unset (default) = hard-drop**: outputDropFilter resolves to
          `isObject && !isRoute("drop")`, dropped events never leave the engine.
        - **truthy = emit**: outputDropFilter resolves to `isObject`, all events
          flow. The downstream forwarder routes by the wire-level `routeState`
          record field.

        Use truthiness (engine string `==` is identity compare): set a non-empty
        value (e.g. `true`) to emit dropped events, leave unset to hard-drop.

    - names:
      - compact_emitted
      description: whether all emitted events are written as `encode()` bytes or as `fullText`
      type: string
      required: false
      doc: |
        Single boolean controlling whether ALL emitted events are compacted on the
        wire. Orthogonal to `emit_dropped`. Applies uniformly: when set, both kept
        and dropped events (if `emit_dropped`) emit as `encode()`; when unset, both
        emit as `fullText`.

        - **unset (default) = fullText**: outputEncodeField resolves to `fullText`
        - **truthy = compact**: outputEncodeField resolves to `encoded=encode()`

        Use truthiness (engine string `==` is identity compare): set a non-empty
        value (e.g. `true`) for compact, leave unset for fullText.

        Per-pattern compact-lookup mode (via `compactReceiverLookupFile`) still
        overrides this when the lookup file is configured.

    - names:
      - outputDropFilter
      description: the filter expression each output stream uses to decide whether a marked object is written
      type: string
      required: false
      defValue: isObject && !isRoute("drop")
      doc: |
        Resolved once by the customer-facing config.yaml from `emit_dropped`, so
        the emit/hard-drop logic lives in one place instead of being duplicated
        per stream:

        - **hard-drop** (default): `isObject && !isRoute("drop")` — dropped objects not written
        - **emit** (`emit_dropped` truthy): `isObject` — everything written; routing
          decision moves downstream to the forwarder based on the wire-level
          `routeState` field.

        Each output stream references it via `$?outputDropFilter`. Named
        outputDropFilter rather than outputFilter, which is a built-in per-stream
        engine option.
