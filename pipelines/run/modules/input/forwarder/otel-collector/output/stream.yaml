# 🔟❎ 'run' OpenTelemetry Collector OTLP/gRPC output stream
#
# Sends processed events back to the OpenTelemetry Collector over OTLP/gRPC.
# The Collector receives them on its `otlp` receiver and forwards to the
# destination exporters on the return pipeline.
#
# Defaults to TCP `127.0.0.1:24225` so it pairs with the OTLP input listening
# on `:4317`. Override with:
#
#   otelCollectorOutputHost: 0.0.0.0
#   otelCollectorOutputPort: 9999
#
# Each top-level field of the rendered event is mapped to an OTLP attribute on
# the returning `LogRecord`. The `body` field is lifted into `LogRecord.body`.
#
# The output mode is driven by `outputEncodeField` and `outputWriteTemplates`
# (see run/modules/input/forwarder/module.yaml):
#
#   receive  (default)               → emit the verbatim event (`fullText`)
#   compact  (receiverOptimize=true) → emit losslessly compacted events +
#                                       the TenXTemplates needed to decode them

tenx: run

include:
  - run/modules/output/event/otlp

outputOtlp:

  - host: $=yield TenXEnv.get("otelCollectorOutputHost", "127.0.0.1")
    port: $=yield TenXEnv.get("otelCollectorOutputPort", "24225")

    fields:
      - $?outputEncodeField=fullText

    encodeType: $?otelCollectorOutputEncodeType=delimited

    writeTemplates: $?outputWriteTemplates=false
