# ─────────────────────────────────────────────────────────────────────────────
# Log10x Logstash sidecar — destinations pipeline
# ─────────────────────────────────────────────────────────────────────────────
#
# This is the `destinations` pipeline referenced from pipelines.yml. It owns
# the `tcp` input that receives processed events back from the Log10x
# sidecar and the `output` block that routes them to your real destinations.
#
# Keep this pipeline filter-free. The pipeline boundary between `ingest`
# and `destinations` is what keeps the enrichment filter chain from firing
# a second time on returning events — adding filters here re-introduces
# the double-enrichment problem.
#
# Bind on 0.0.0.0 so a Kubernetes kubelet tcpSocket probe can reach the
# port from the pod IP — a loopback-only bind would refuse the probe.
# The Log10x sidecar still connects via 127.0.0.1 (same pod, same network
# namespace).

input {
  tcp {
    id    => "in_from_tenx"
    host  => "0.0.0.0"
    port  => 5045
    codec => json_lines
  }
}

output {
  # `destinations` is the terminal pipeline — replace the stdout block
  # below with your real destinations (`elasticsearch`, `opensearch`,
  # `splunk_hec`, `kafka`, `s3`, …). The original `tag` field added by the
  # ingest pipeline is preserved on each event, so destinations that route
  # on it (Splunk index, S3 prefix, Kafka topic, …) see the same value
  # they would without Log10x in the path.
  stdout {
    id    => "out_stdout"
    codec => json_lines
  }
}
