# ─────────────────────────────────────────────────────────────────────────────
# Log10x Logstash sidecar — pipelines.yml driver
# ─────────────────────────────────────────────────────────────────────────────
#
# Logstash isolates filter chains by running them in separate pipelines. The
# sidecar pattern uses two pipelines: `ingest` (sources + enrichment filters
# + tcp output to Log10x) and `destinations` (tcp input from Log10x + real
# destination outputs). Filters under `ingest` never run on returning events
# because Logstash's pipeline boundary is the structural bypass — equivalent
# to Fluentd's `@INGEST` / `@OUTPUT` label split.
#
# Reference the per-pipeline `.conf` files from this directory. In your own
# deployment, point `path.config` at copies you've customized for your
# environment.

- pipeline.id: ingest
  path.config: "${TENX_MODULES}/pipelines/run/modules/input/forwarder/logstash/conf/tenx-ingest.conf"

- pipeline.id: destinations
  path.config: "${TENX_MODULES}/pipelines/run/modules/input/forwarder/logstash/conf/tenx-destinations.conf"
