#
# 🔟❎ 'run' OpenTelemetry Collector input module
#
# Sidecar-only integration. Log10x runs as a peer process to the OpenTelemetry
# Collector; the Collector sends events to Log10x via its native `otlp`
# exporter (OTLP/gRPC) and receives processed events back via its `otlp`
# receiver. Both ports use core OTLP/gRPC, so the core `otelcol` distribution
# is sufficient (no `otelcol-contrib` build required).

module:

  name: otelCollector

  title: OpenTelemetry Collector

  description: receive and optimize events collected by the OpenTelemetry Collector via OTLP/gRPC (both directions)

  moduleSort: [otelCollectorInput, otelCollectorOutput]

  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/otel-collector/doc.md":""

  allowMultiple: false

  options:

    - names:
      - otelCollectorOutputFields
      description: list of TenXObject field names to include alongside the main event in output
      type: list
      required: false
      defValue: []
      doc: |
        specifies TenXObject field names to emit alongside the main event text
        when writing back to the OpenTelemetry Collector. When empty (default),
        only the main event field is written. Example fields: level, group,
        symbolMessage.

    - names:
      - otelCollectorOutputEncodeType
      description: "output format when outputFields are set. Possible values: [json, delimited]"
      type: string
      required: false
      defValue: delimited
      doc: |
        specifies how the combined output (main event field plus outputFields)
        is encoded when writing back to the OpenTelemetry Collector. Possible
        values:
        - **json**: formats all fields as a JSON object
        - **delimited**: formats field values separated by the output delimiter
        Only takes effect when otelCollectorOutputFields is set.
