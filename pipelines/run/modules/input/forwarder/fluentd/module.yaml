#
# 🔟❎ 'run' Fluentd input module
#
# Sidecar-only integration. Log10x runs as a peer process to Fluentd; the
# two exchange events over the native Fluent Forward protocol on both
# directions. No `exec_filter` / stdin subprocess pattern is supported.

module:

  name: fluentd

  title: Fluentd

  description: receive and optimize events collected by Fluentd via the Fluent Forward protocol

  moduleSort: [fluentdInput, fluentdOutput]

  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/fluentd/doc.md":""

  allowMultiple: false

  # Shared output-formatting options used by the Fluentd Forward output.
  options:

    - names:
      - fluentdOutputFields
      description: list of TenXObject field names to include alongside the main event in output
      type: list
      required: false
      defValue: []
      doc: |
        specifies TenXObject field names to emit alongside the main event text
        when writing back to Fluentd. When empty (default), only the main event
        field is written. Example fields: level, group, symbolMessage.

    - names:
      - fluentdOutputEncodeType
      description: "output format when outputFields are set. Possible values: [json, delimited]"
      type: string
      required: false
      defValue: delimited
      doc: |
        specifies how the combined output (main event field plus outputFields)
        is encoded when writing back to Fluentd. Possible values:
        - **json**: formats all fields as a JSON object
        - **delimited**: formats field values separated by the output delimiter
        Only takes effect when fluentdOutputFields is set.
