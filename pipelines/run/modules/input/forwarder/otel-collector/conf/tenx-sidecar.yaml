# ─────────────────────────────────────────────────────────────────────────────
# Log10x OpenTelemetry Collector sidecar recipe
# ─────────────────────────────────────────────────────────────────────────────
#
# Drop this into your OTel Collector config (or merge its blocks into your
# existing config) to wire the Collector up to a Log10x sidecar process.
# Events flow:
#
#   receivers ──► logs/to-tenx ──► otlp/tenx exporter ──► Log10x:4317
#                  (enrichment)                                │
#                                                              ▼
#                                                           Receiver
#                                                              │
#   destinations ◄── logs/from-tenx ◄── otlp/tenx receiver ◄── Log10x:24225
#                                       (no processors)
#
# How each event is handled:
#
#   1. Receivers feed events into the `logs/to-tenx` pipeline. The file
#      receiver parses each container log line and joins the lines of one
#      multi-line event (a stack trace) into one record before it leaves.
#   2. Processors on `logs/to-tenx` (k8sattributes, resource, attributes,
#      transform, …) apply enrichment exactly once per event before the
#      handoff to Log10x.
#   3. The `otlp/tenx` exporter sends the enriched event to the Log10x
#      sidecar over OTLP/gRPC on TCP `:4317`. Resource attributes
#      (`service.name`, `k8s.pod.name`, `k8s.namespace.name`, …), scope
#      identity, log-record attributes, severity, timestamp, and body are
#      all preserved on the wire.
#   4. Log10x processes the event (rate/policy filtering, optional compaction).
#   5. The processed event comes back to the Collector on `:24225` via the
#      `otlp/tenx` receiver, surfacing on the `logs/from-tenx` pipeline. The
#      OTLP `LogRecord.body` carries the message verbatim; everything else
#      that came in on OTLP returns as a log-record attribute (the resource-
#      vs-log distinction collapses; everything comes back as a log attribute).
#   6. `logs/from-tenx` holds only destination exporters, no processors.
#      Keep this pipeline processor-free so enrichment runs exactly once.
#
# Custody. Log10x answers an export only once every line of it has been
# written back to this Collector and acknowledged, removed by its output
# filter, or rejected by its decoder, so the Collector holds each line until
# then. The settings marked `custody` keep that hold on disk:
#
#   - `file_storage` holds the file positions and the `otlp/tenx` queue, so a
#     restart of either process resends what Log10x had not answered;
#   - `otlp/tenx` retries without a deadline and waits long enough for an
#     answer;
#   - no `batch` processor stands between a receiver and a persisted queue on
#     either pipeline: a batch processor acknowledges what it holds in memory.
#     Batching happens inside the persisted queue instead.
#
# A Collector restart keeps every line the file receiver has passed on. The
# `recombine` operator keeps the newest event of each file in memory until the
# event's next first line arrives or its flush period ends.
#
# Run Log10x:
#
#   tenx @run/input/forwarder/otel-collector @apps/receiver
#
# Run the Collector. filelog, its operators and file_storage ship in the contrib
# distribution. The feature gate makes the file receiver hand each batch of
# lines on before it records its position, instead of from a buffer it fills
# in the background:
#
#   otelcol-contrib --config=<this-file> --feature-gates=stanza.synchronousLogEmitter
#
# The receiver, operator, queue and retry keys below are checked against the
# v0.143.0 sources of the contrib file receiver and the core exporter helper,
# and the file_storage keys against a contrib 0.160.0 run; check them against
# the release you deploy.
#
# ─────────────────────────────────────────────────────────────────────────────

extensions:

  # custody: file positions and the export queue, kept across restarts. The
  # directory must exist and be writable by the Collector.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    timeout: 10s

receivers:

  # Replace this with your own receivers. Anything that feeds `logs/to-tenx`
  # passes through Log10x; anything that feeds `logs/from-tenx` directly
  # skips the structural bypass and risks loops.
  filelog:
    include: [/var/log/pods/*/*/*.log]
    include_file_path: true
    start_at: beginning
    # custody: the file positions live in file_storage, so a restart resumes
    # where the last acknowledged batch ended.
    storage: file_storage
    operators:
      # Parses the container runtime's line format and rejoins the lines the
      # runtime split. Every runtime line starts with a timestamp, so
      # multi-line events are joined after this parser, on the parsed body.
      - type: container
      # A line that starts with whitespace or with "at " continues the event
      # before it (stack frames); any other line starts a new event.
      - type: recombine
        combine_field: body
        combine_with: "\n"
        is_first_entry: 'not (body matches "^(\\s|at )")'

  # Receive processed events back from the Log10x sidecar.
  #
  # Bind on 0.0.0.0 so a Kubernetes kubelet probe can reach the port from
  # the pod IP. The Log10x sidecar still connects via 127.0.0.1 (same pod,
  # same network namespace).
  otlp/tenx:
    protocols:
      grpc:
        endpoint: 0.0.0.0:24225

# Put all your enrichment in a `processors:` section here, `k8sattributes`,
# `resource`, `attributes`, `transform`, `filter`, etc., and list it on
# `logs/to-tenx`, which fires the processors exactly once per event before the
# handoff to Log10x. The return pipeline (`logs/from-tenx`) bypasses them by
# structural wiring. Leave `batch` out: the `otlp/tenx` queue batches on disk.

exporters:

  # Hand off to the Log10x sidecar over OTLP/gRPC. All resource attributes,
  # scope info, log-record attributes, and the body survive the wire.
  otlp/tenx:
    endpoint: 127.0.0.1:4317
    tls:
      insecure: true
    # custody: Log10x answers once the export's lines are written back and
    # acknowledged, which can take its group flush timeout (5 s) when other
    # requests keep it busy, plus its output flush interval (1 s) and this
    # Collector's own acknowledgement of the return write. Below that, an
    # export still being processed times out and is sent again.
    timeout: 30s
    # custody: retry for as long as Log10x is unreachable or refuses a request
    # (it refuses with UNAVAILABLE when its queue is full).
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0
    sending_queue:
      enabled: true
      # One sender keeps records in the order they were read; the engine
      # groups multi-line events from consecutive records.
      num_consumers: 1
      # custody: the queue lives on disk and backs the file receiver up when
      # full instead of dropping a batch.
      storage: file_storage
      block_on_overflow: true
      # Requests to Log10x stay under the 4 MiB gRPC message limit it accepts.
      batch:
        flush_timeout: 1s
        sizer: bytes
        min_size: 1048576
        max_size: 2097152

  # `debug` is the terminal exporter for this recipe, replace it with your
  # real destinations (`elasticsearch`, `splunk_hec`, `kafka`, `awss3`, …).
  # Wire your destination exporters into `logs/from-tenx` only; that's what
  # keeps the enrichment processors above from running a second time on
  # returning events.
  #
  # custody: give each destination exporter a persisted queue that retries
  # without a deadline, so a record this Collector acknowledged to Log10x is
  # on disk until the destination takes it:
  #
  #   otlp/destination:
  #     endpoint: <your endpoint>
  #     retry_on_failure:
  #       enabled: true
  #       max_elapsed_time: 0
  #     sending_queue:
  #       enabled: true
  #       storage: file_storage
  debug:
    verbosity: detailed

service:

  extensions: [file_storage]

  pipelines:

    logs/to-tenx:
      receivers: [filelog]
      exporters: [otlp/tenx]

    # No processors, and no `batch` in particular: the Collector acknowledges
    # Log10x's export when every exporter here has accepted the records.
    logs/from-tenx:
      receivers: [otlp/tenx]
      exporters: [debug]
