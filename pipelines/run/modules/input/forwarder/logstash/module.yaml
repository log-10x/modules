#
# 🔟❎ 'run' Logstash input module
#
# Sidecar-only integration. Log10x runs as a peer process to Logstash; the
# two exchange events over TCP (or Unix sockets on Linux/macOS) — events
# arrive as newline-delimited JSON from Logstash's `tcp` output and return
# the same way for Logstash's `tcp` input. No `pipe`-output / stdin
# subprocess pattern is supported.

module:

  name: logstash

  title: Logstash

  description: receive and optimize events collected by Logstash via newline-delimited JSON

  moduleSort: [logstashInput, logstashOutput]

  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/logstash/doc.md":""

  allowMultiple: false

  # Shared output-formatting options used by the Logstash JSON socket output.
  options:

    - names:
      - logstashOutputFields
      description: list of TenXObject field names to include alongside the main event in output
      type: list
      required: false
      defValue: []
      doc: |
        specifies TenXObject field names to emit alongside the main event text
        when writing back to Logstash. When empty (default), only the main event
        field is written. Example fields: level, group, symbolMessage.

    - names:
      - logstashOutputEncodeType
      description: "output format when outputFields are set. Possible values: [json, delimited]"
      type: string
      required: false
      defValue: delimited
      doc: |
        specifies how the combined output (main event field plus outputFields)
        is encoded when writing back to Logstash. Possible values:
        - **json**: formats all fields as a JSON object
        - **delimited**: formats field values separated by the output delimiter
        Only takes effect when logstashOutputFields is set.
