#
# 🔟❎ 'run' Filebeat input module

module:

  name: filebeat

  title: Filebeat input

  description: report, receive, and optimize events collected by Filebeat forwarders

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/input/forwarder/filebeat

  moduleSort: [filebeatReceive]

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/filebeat/doc.md":""
