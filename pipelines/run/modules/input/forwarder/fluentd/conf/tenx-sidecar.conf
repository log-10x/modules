# ─────────────────────────────────────────────────────────────────────────────
# Log10x Fluentd recipe — Forward-protocol sidecar (recommended)
# ─────────────────────────────────────────────────────────────────────────────
#
# Wires Fluentd to a Log10x peer process using the native Fluent Forward
# protocol. Unlike the older exec_filter recipes in this folder, this pattern:
#
#   • Uses any stock Fluentd build (td-agent, fluent-package, OSS) — no
#     subprocess spawning, no fluentd Lua/Ruby filter requirement.
#   • Composes via pure values overlay on any official Helm chart — no fork.
#   • Cleanly avoids re-running enrichment filters on the return path, using
#     Fluentd's native <label> directive as a scope boundary.
#
# Flow:
#
#   sources ──► @INGEST ──► enrichment filters ──► out_forward ──► Log10x:24224
#                                                                       │
#                                                                       ▼
#                                                                    Receiver
#                                                                       │
#   user outputs ◄── @OUTPUT ◄── in_forward ◄── Log10x out (:24225) ────┘
#
# The @OUTPUT label has NO <filter> blocks: events returning from Log10x
# bypass the enrichment chain. Fluentd labels are isolated scopes — events
# delivered to a label do not flow back through top-level <filter> blocks
# or other labels, so this is structurally guaranteed by Fluentd itself.
#
# ─────────────────────────────────────────────────────────────────────────────
# Run Log10x:
#
#   tenx @run/input/forwarder/fluentd/sidecar @apps/receiver
#
# Run Fluentd:
#
#   fluentd -c <this-file>
#
# ─────────────────────────────────────────────────────────────────────────────

# Suppress Fluentd internal logs (otherwise they self-loop into @OUTPUT).
<label @FLUENT_LOG>
  <match **>
    @type null
    @id ignore_fluent_logs
  </match>
</label>

# ───────── INGEST: source(s) + enrichment + send to Log10x ─────────

# Replace this <source> with your own (tail, http, syslog, forward, etc.).
# Every source MUST route to @INGEST via the `@label @INGEST` directive,
# otherwise it bypasses Log10x entirely.
<source>
  @type tail
  @id in_tail_example
  path /var/log/containers/*.log
  pos_file /var/log/fluentd-containers.pos
  read_from_head true
  tag k8s.containers
  @label @INGEST
  <parse>
    @type json
  </parse>
</source>

<label @INGEST>
  # Add any enrichment filters here (k8s_metadata, parser, record_transformer,
  # etc.). They run exactly once per event — before forwarding to Log10x.
  # Returning events are routed straight to @OUTPUT and DO NOT re-enter this
  # label, so the filters do not double-fire.
  <filter **>
    @type record_transformer
    enable_ruby false
    <record>
      cluster "${ENV['CLUSTER_NAME'] || 'unset'}"
    </record>
  </filter>

  # Hand off to Log10x via Forward protocol over TCP.
  # On Linux, switch to a Unix socket for lower overhead by replacing the
  # <server> block with `<transport unix>` and setting `path` accordingly.
  <match **>
    @type forward
    @id out_to_tenx
    send_timeout 5s
    require_ack_response false
    <server>
      host 127.0.0.1
      port 24224
    </server>
    <buffer>
      @type memory
      flush_interval 1s
      flush_thread_count 1
    </buffer>
  </match>
</label>

# ───────── EGRESS: receive processed events + route to outputs ─────────

# Forward source for processed events coming back from Log10x. The original
# tag is preserved by the Forward protocol, so destinations that route by
# tag (e.g. Splunk `$TAG` index routing, S3 `$TAG` path templates) see the
# same value they would have seen without Log10x in the path.
<source>
  @type forward
  @id in_from_tenx
  bind 127.0.0.1
  port 24225
  @label @OUTPUT
</source>

# @OUTPUT — terminal label, NO filters. Replace <match> with your real
# destinations (out_elasticsearch, out_splunk_hec, out_kafka2, out_s3, …).
# The label boundary is what prevents the @INGEST enrichment chain from
# firing a second time on returning events.
<label @OUTPUT>
  <match **>
    @type stdout
    @id out_stdout
  </match>
</label>
