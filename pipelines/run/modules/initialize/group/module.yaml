#
# 🔟❎ 'run' TenXObject group unit

unit:

  name: groupInitializer

  title: Group initializer

  description: combine multi-line events into TenXObject group instances

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/initialize/group

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/initialize/group/doc.md":""

  # 'allowMultiple' is disabled for this unit. Pipeline command line arguments and configuration files
  #  can specify a single value at max for each option defined below.
  allowMultiple: false
       
  # 'options' defines a group of named/typed configuration values to pass to a pipeline unit/module at startup
  #  via command line arguments (e.g., '> tenx -myA X -myB Y') or YAML launch files (e.g., '> tenx @my.config').
  #  Instances of this group passed are accessible at runtime via TenXEnv.get: https://doc.log10x.com/api/js/#TenXEnv.get
  options:
 
    - names:
        - groupIndicators
      description: list of strings that, when matched at the start of a log line's text, designate it as a group head.
      type: list
      required: false
      doc: |
        A list of strings that, when matched at the start of a log line's text, designate it as a group head.

        Unmatched lines default to `false`, indicating they are group children (continuation-by-default).

        - `192.` - Indicates a private IP address, common in web server logs (e.g., "192.168.1.1 - - [...]").
        - `10.` - Indicates a private IP range, often in Kubernetes or internal network logs (e.g., "10.244.0.125 - - [...]").
        - `GET ` - Indicates an HTTP GET request, marking the start of a web transaction log (e.g., "GET /index.html HTTP/1.1").
        - `\x1b[2m` - Indicates a line that opens in ANSI dim, the way Rust tracing prints the timestamp of a coloured line. The escape code is glued to the year, so the timestamp is not recognised and the line needs this indicator to head its own event.
        - `at ` - Indicates a Java/C# stack trace continuation.

    - names:
        - groupChildLabels
      description: labels that mark a line as a child of the event above it, even when the line has its own timestamp.
      type: list
      required: false
      doc: |
        A list of labels that mark a line as a child of the event above it in the same stream, even when the line has its own timestamp. Empty by default.

        A line's label is the word before its first colon followed by two spaces, where that word starts the line or follows a space, a colon or a closing bracket. PostgreSQL writes its log prefix and then a label such as `ERROR:  ` or `DETAIL:  ` on each line of one error, so the `ERROR` line heads the event and the lines below it join that event. The shipped configuration lists:

        - `DETAIL`, `HINT`, `CONTEXT` and `STATEMENT`: PostgreSQL lines that add to the error or message above them.
        - `QUERY` and `LOCATION`: PostgreSQL lines that give the internal query and the source location of the error above them.

        The rule reads the line's own text, once per template, so a line's place in its event holds across restarts and nodes.
