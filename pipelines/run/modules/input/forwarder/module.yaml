#
# 🔟❎ 'run' forwarder input modules

module:

  name: forwarderInputs

  title: Log Forwarder inputs

  description: report, receive and optimize events collected by log forwarders

  # 'doc' specifies the markdown doc content, only required when generating docs.
  doc: +include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/doc.md":""

  # 'configFolder' specifies a folder containing default configuration files for the settings defined by this unit/module
  configFolder: run/input/forwarder

  moduleSort: [fluentbit,fluentd,otelCollector,vector,filebeat,logstash,splunkUF,datadogAgent]

  # Shared options applicable across all forwarder flavors.
  #
  # The regulator-dropped behavior is controlled by two orthogonal booleans
  # the user sets directly:
  #
  #   emit_dropped     = does the regulator-marked slice survive the output filter?
  #   compact_emitted  = do all emitted events emit as encode() bytes or as fullText?
  #
  # They compose into four coherent behaviors:
  #
  #   emit_dropped | compact_emitted | behavior
  #   -------------|-----------------|--------------------------------------------------
  #   false        | false           | hard-drop the bad ones. Kept events emit fullText.
  #   false        | true            | hard-drop the bad ones. Kept events emit compacted.
  #   true         | false           | emit everything fullText. Forwarder routes by `routeState`.
  #   true         | true            | emit everything compacted. (niche)
  #
  # `routeState` is stamped on every record the receiver handles, receive mode
  # included (measured 2026-09-28: `pass` on each record). It is NOT always on
  # the wire, though: it ships only when the resolved output expression asks
  # for it, which is the offload and soft-drop modes:
  #
  #   receiverOptimize=true  -> encode(<hash>)                  not on the wire
  #   outputOffload  truthy  -> fullText(<hash>,"routeState")    on the wire
  #   outputSoftDrop truthy  -> isRoute("compact") ? encode(...) : fullText(...)
  #                                                              on the wire
  #   neither (receive mode) -> fullText(<hash>)                 not on the wire
  #
  # The canonical wiring is the `encodeField` ternary in the CONFIG repo,
  # config/pipelines/run/input/forwarder/config.yaml, keyed on
  # receiverOptimize / outputOffload / outputSoftDrop. It is NOT keyed on the
  # `emit_dropped` / `compact_emitted` names documented below, and no config
  # in either repo reads those two options today, so the paragraph that
  # claimed a receiver-app mapping pointed at wiring that does not exist.
  #
  # Measured 2026-08-08 on a full demo recording (32,805 events, receive mode
  # with `receiverOptimize false` + `symbolMessageHashField tenx_hash`, which
  # resolves to the last branch): tenx_hash present on 32,772 records, and
  # routeState on the wire on ZERO. The 33 records without a hash are ASCII-art
  # boot banners, which carry no message and therefore no pattern. A reader
  # who trusted the old sentence would have called that a wire regression;
  # it is the configured behaviour.
  options:

    - names:
      - forwarderInputBytesLimit
      description: the most bytes a forwarder input reads in each forwarderInputBytesInterval, 0 for no limit
      type: string
      required: false
      defValue: 2MB
      doc: |
        The most bytes a forwarder input (Fluent Bit, Fluentd, Vector,
        Filebeat, Logstash, OpenTelemetry Collector) reads from its socket in
        each `forwarderInputBytesInterval`, such as `20MB`. When the limit is
        reached, the input stops reading until the interval ends, and the
        forwarder holds the events in its own buffer meanwhile; no event is
        dropped.

        The default is `2MB` a second. `0` sets no byte limit: the input then
        stops reading only when the pipeline holds as many events as
        `objectLimitMaxInstances` allows (by default 5,000 for each 100 MB of
        heap).

        Raise it to let one Receiver take more than 2 MB a second, for example
        `forwarderInputBytesLimit 20MB`.

    - names:
      - forwarderInputBytesInterval
      description: the interval forwarderInputBytesLimit counts bytes over
      type: string
      required: false
      defValue: 1s
      doc: |
        The interval over which `forwarderInputBytesLimit` counts the bytes a
        forwarder input reads, such as `1s` (the default) or `1m`. Has no
        effect while `forwarderInputBytesLimit` is `0`.

    - names:
      - outputEncodeField
      description: the single field expression each forwarder's output stream writes per event
      type: string
      required: false
      defValue: fullText
      doc: |
        Derived by the customer-facing config.yaml from `compact_emitted` (and
        from the legacy per-pattern `compactReceiverLookupFile` lookup when set):

        - **compact_emitted=false** (default): `fullText`, every event passes through full text
        - **compact_emitted=true**: `encoded=encode()`, every emitted event compacted losslessly
        - **compact-lookup (legacy)**: `encoded=shouldEncode() ? encode() : fullText`,
          per-pattern decision via the compactReceiver module (requires
          `compactReceiverLookupFile`)

        Advanced users can override directly to customize the output field expression.

    - names:
      - outputWriteTemplates
      description: whether the forwarder emits new TenXTemplates alongside encoded events
      type: string
      required: false
      defValue: "false"
      doc: |
        True for encoding modes (compact-all, compact-lookup) so decoders can
        reconstruct events from templateHash + vars. False for receive mode
        (no encoding → no templates needed).

    - names:
      - emit_dropped
      description: whether regulator-marked (`routeState="drop"`) events survive the output filter
      type: string
      required: false
      doc: |
        Single boolean controlling whether the regulator-dropped slice reaches the
        forwarder. Orthogonal to `compact_emitted`.

        - **unset (default) = hard-drop**: outputDropFilter resolves to
          `isObject && !isRoute("drop")`, dropped events never leave the engine.
        - **truthy = emit**: outputDropFilter resolves to `isObject`, all events
          flow. The downstream forwarder routes by the wire-level `routeState`
          record field.

        Use truthiness (engine string `==` is identity compare): set a non-empty
        value (e.g. `true`) to emit dropped events, leave unset to hard-drop.

    - names:
      - compact_emitted
      description: whether all emitted events are written as `encode()` bytes or as `fullText`
      type: string
      required: false
      doc: |
        Single boolean controlling whether ALL emitted events are compacted on the
        wire. Orthogonal to `emit_dropped`. Applies uniformly: when set, both kept
        and dropped events (if `emit_dropped`) emit as `encode()`; when unset, both
        emit as `fullText`.

        - **unset (default) = fullText**: outputEncodeField resolves to `fullText`
        - **truthy = compact**: outputEncodeField resolves to `encoded=encode()`

        Use truthiness (engine string `==` is identity compare): set a non-empty
        value (e.g. `true`) for compact, leave unset for fullText.

        Per-pattern compact-lookup mode (via `compactReceiverLookupFile`) still
        overrides this when the lookup file is configured.

    - names:
      - outputDropFilter
      description: the filter expression each output stream uses to decide whether a marked object is written
      type: string
      required: false
      defValue: isObject && !isRoute("drop")
      doc: |
        Resolved once by the customer-facing config.yaml from `emit_dropped`, so
        the emit/hard-drop logic lives in one place instead of being duplicated
        per stream:

        - **hard-drop** (default): `isObject && !isRoute("drop")`, dropped objects not written
        - **emit** (`emit_dropped` truthy): `isObject`, everything written; routing
          decision moves downstream to the forwarder based on the wire-level
          `routeState` field.

        Each output stream references it via `$?outputDropFilter`. Named
        outputDropFilter rather than outputFilter, which is a built-in per-stream
        engine option.

    - names:
      - receiverReadOnly
      description: read-only mode, receive events, emit metrics, do not write back to the forwarder
      type: boolean
      required: false
      defValue: false
      doc: |
        when true, the return output each forwarder input opens (Forward for
        Fluent Bit, Fluentd and Vector, Unix socket for Filebeat, TCP socket
        for Logstash, OTLP for the OpenTelemetry Collector) is not constructed,
        so no event and no template is written back to the forwarder; the
        aggregators still run and publish their metrics.

        The [Reporter](https://doc.log10x.com/apps/reporter/) sets it to
        `true`. With the [Receiver](https://doc.log10x.com/apps/receiver/) it
        defaults to `false`. Declared here so that it is accepted as a launch
        argument or a configuration key with any app that loads a forwarder
        input; the Receiver and Reporter apps declare it with the same name,
        type and default.

    - names:
      - splunkFieldsForm
      description: "add each compact event's fields, as Splunk extracts them from its text, to its record. Possible values: [json, meta]"
      type: string
      required: false
      doc: |
        When set, each event the Receiver writes with `encode()` also carries the
        fields Splunk's key-value extraction finds in its text (`name=value` and
        `name="value"` pairs separated by spaces or commas, as the FortiGate
        add-on reads them), so Splunk indexes them with the compact event:

        - **json**: a `fields` object in the record, for the HTTP Event Collector
        - **meta**: a `meta` text of `name::"value"` pairs in the record, which
          the Log10x App's unwrap rule adds to the event on a heavy forwarder

        Each event that carries fields also carries `tenx_mapped`. An event whose
        fields cannot be written exactly as Splunk extracts them, such as one with
        a value longer than `splunkFieldsMaxValue`, is written whole instead.
        The record must not already have a key named `fields` or `meta`.
        Unset (the default), records are written as before.

    - names:
      - splunkFieldsMaxValue
      description: the longest field value splunkFieldsForm writes; an event with a longer value is written whole
      type: number
      required: false
      defValue: 1000
      doc: |
        The most characters of a field value `splunkFieldsForm` writes. An event
        with a longer value is written whole, so that Splunk extracts its fields
        from its text. Splunk returns up to 1,000 characters of an indexed value
        in a search.

    - names:
      - splunkFieldsNames
      description: the fields splunkFieldsForm writes, all or a list of names
      type: string
      required: false
      defValue: all
      doc: |
        `all` (the default) writes every field of the event. A list of names,
        separated by commas, writes only those fields, for example the fields
        the data models and detections in use read.
