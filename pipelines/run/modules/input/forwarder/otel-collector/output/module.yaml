#
# 🔟❎ 'run' OpenTelemetry Collector Forward output module

module:

  name: otelCollectorOutput

  title: OpenTelemetry Collector Fluent Forward output

  description: send processed events back to the OpenTelemetry Collector over the Fluent Forward protocol

  doc: '+include $=TenXEnv.get("docGenerate") ? "run/modules/input/forwarder/otel-collector/output/doc.md":""'

  allowMultiple: false

  options:

    - names:
        - otelCollectorOutputHost
      description: TCP host of the OpenTelemetry Collector's fluent_forward receiver
      type: String
      required: false
      defValue: 127.0.0.1
      doc: |
        Hostname or IP where the OpenTelemetry Collector's `fluent_forward`
        receiver is listening for processed events from Log10x. Pairs with
        `otelCollectorOutputPort`.

    - names:
        - otelCollectorOutputPort
      description: TCP port of the OpenTelemetry Collector's fluent_forward receiver
      type: String
      required: false
      defValue: 24225
      doc: |
        TCP port where the OpenTelemetry Collector's `fluent_forward` receiver
        is listening for processed events from Log10x. MUST differ from the
        port Log10x's own OTLP/gRPC input listens on (default `4317`) or the
        two would collide on the same listener.

    - names:
        - otelCollectorOutputPath
      description: Unix domain socket path of the OpenTelemetry Collector's fluent_forward receiver (Linux/macOS)
      type: String
      required: false
      defValue:
      doc: |
        Optional Unix domain socket path for the OpenTelemetry Collector's
        `fluent_forward` receiver. When set, takes precedence over
        `otelCollectorOutputHost` / `otelCollectorOutputPort`. Linux/macOS
        only — ignored on Windows.
