# 🔟❎ 'run' OpenTelemetry Collector input + output streams
#
# Listens for log records via OTLP/gRPC (paired with the Collector's
# `otlp` exporter) and sends processed records back via OTLP/gRPC
# (paired with the Collector's `otlp` receiver).

tenx: run

runtimeAttributes:
  - fwd_input:otel-collector

include:
  - run/modules/output/event/otlp

# ============================== Extractor ====================================

extractor:
  - name: otel
    type: json
    actions:
      - $=yield "captureFirst:" + TenXEnv.get("otelCollectorInputMessageField", "body")
      - drop:tag

# ============================== Input ========================================

input:

  - type: stream
    name: otelCollector

    path: com.log10x.ext.edge.input.otlp.OtlpLogsInputStream

    extractors:
      - otel
      - "$=yield TenXEnv.get(\"k8sExtractorName\") ? \"fluentK8s\" : \"\""

    sourcePattern: \"tag\":\"(.*?)\"

    # Group each container's stdout and stderr on their own, also when
    # containers share a service.name; the tag stays the source. filelog
    # receiver with the container parser: log.file.path, log.iostream and
    # the k8s.* resource attributes. k8sattributes: container.id.
    sequenceFields:
      - log.file.path
      - k8s.pod.uid
      - k8s.container.name
      - container.id
      - log.iostream

    args:
      - port
      - $=yield TenXEnv.get("otelCollectorInputPort", "4317")
      - maxQueuedLines
      - $=yield TenXEnv.get("otelCollectorInputMaxQueuedLines", "20000")

    backpressure:
      intervalBytesLimit: $=parseBytes("2MB")
      intervalBytesDuration: $=parseDuration("1s")

# ============================== Output =======================================

outputOtlp:

  - host: $=yield TenXEnv.get("otelCollectorOutputHost", "127.0.0.1")
    port: $=yield TenXEnv.get("otelCollectorOutputPort", "24225")

    fields:
      - $?outputEncodeField=fullText

    encodeType: $?otelCollectorOutputEncodeType=delimited

    writeTemplates: $?outputWriteTemplates=false
