# 🔟❎ 'run' rate receiver settings

# Set the 10x pipeline to 'run'
tenx: run

# Exactly one regulator class is loaded based on whether a mute file is
# configured (the two variants are mutually exclusive via `shouldLoad`):
#   - rateReceiverLookupFile UNSET -> RegulatorObject (rate-object-local.js)
#     -> shouldRetainEvent(): pure share-cap regulator.
#   - rateReceiverLookupFile SET   -> RegulatorWithMuteObject
#     (rate-object-lookup.js) -> shouldRetainEventWithMute(): same regulator
#     preceded by a "file wins" mute check.
#
# The two classes expose DIFFERENT getter names because method names are in a
# GLOBAL namespace across all parsed classes (the engine validates every class
# regardless of shouldLoad). The single groupFilters slot dispatches via an env
# ternary so only ONE method is referenced per event; the other class has
# shouldLoad=false and its method is never invoked.
#
# Outer quotes on the list entry are REQUIRED -- the inner `: "..."` of the
# ternary is YAML mapping syntax otherwise.
groupFilters:
  - '$=yield TenXEnv.get("rateReceiverLookupFile") ? "shouldRetainEventWithMute()" : "shouldRetainEvent()"'
